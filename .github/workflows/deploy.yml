name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # numbl is a `file:../../numbl` dependency, as in turing-surface: we use
      # its compiler internals, which its package `exports` do not expose, so it
      # is cloned where that relative path expects it. It must be at or after
      # 3f63b47d (realsqrt, the fixed-point inline pass). Its stdlib bundle is
      # generated rather than committed, and the planner imports numbl's
      # interpreter (src/mgpu/randnfun3.ts), so the bundle is built here.
      - name: Check out numbl (sibling dependency)
        env:
          NUMBL_REF: main
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/flatironinstitute/numbl.git "$GITHUB_WORKSPACE/../../numbl"
          git -C "$GITHUB_WORKSPACE/../../numbl" checkout --quiet "$NUMBL_REF"
          node "$GITHUB_WORKSPACE/../../numbl/scripts/bundle-stdlib.ts"
      # --ignore-scripts: npm runs a linked package's `prepare` script, and
      # numbl's is husky, which is not installed here.
      - run: npm ci --ignore-scripts
      # The checks compile MATLAB to compute shaders and need a GPU, which the
      # runner does not have; they say so and skip.
      - run: npm run test:node -- --skip-without-gpu
      - run: npm run build
      # Pages must already be enabled with "GitHub Actions" as the source.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
